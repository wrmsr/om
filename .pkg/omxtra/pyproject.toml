[build-system]
requires = [
    'setuptools',
]
build-backend = 'setuptools.build_meta'

[project]
name = 'omxtra'
authors = [
    {name = 'wrmsr'},
]
urls = {source = 'https://github.com/wrmsr/om'}
license = 'BSD-3-Clause'
readme = 'README.md'
requires-python = '>=3.14'
version = '0.0.65'
classifiers = [
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Operating System :: POSIX',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
]
description = 'omxtra'
dependencies = [
    'omcore == 0.0.65',
]

[project.optional-dependencies]
omdev = [
    'omdev == 0.0.65',
]
ominfra = [
    'ominfra == 0.0.65',
]
ssh = [
    'asyncssh ~= 2.24',
    'paramiko ~= 5.0',
]
wiki = [
    'mwparserfromhell ~= 0.7',
    'wikitextparser ~= 3.0',
]
zmq = [
    'pyzmq ~= 27.2',
]
all = [
    'omdev == 0.0.65',
    'ominfra == 0.0.65',
    'asyncssh ~= 2.24',
    'paramiko ~= 5.0',
    'mwparserfromhell ~= 0.7',
    'wikitextparser ~= 3.0',
    'pyzmq ~= 27.2',
]

[project.entry-points]
'omcore.manifests' = {omxtra = 'omxtra'}

[tool.setuptools]

[tool.setuptools.packages.find]
include = [
    'omxtra',
    'omxtra.*',
]
exclude = [
    '*.tests',
    '*.tests.*',
]

[tool.setuptools.package-data]
'*' = [
    '*.c',
    '*.cc',
    '*.cu',
    '*.h',
    '*.hh',
    '*.js',
    '*.mjs',
    '*.ts',
    '*.abnf',
    '*.g4',
    '.om-manifests.json',
    'py.typed',
    '*.md',
    'README',
    'README.rst',
    'LICENSE',
    'LICENSE.txt',
    'LICENSE.rst',
    'LICENSE.md',
    'LICENCE',
    'LICENCE.txt',
    'LICENCE.rst',
    'LICENCE.md',
    'AUTHORS',
]
