[build-system]
requires = [
    'setuptools',
]
build-backend = 'setuptools.build_meta'

[project]
name = 'omllm'
authors = [
    {name = 'wrmsr'},
]
urls = {source = 'https://github.com/wrmsr/om'}
license = 'BSD-3-Clause'
readme = 'README.md'
requires-python = '>=3.14'
version = '0.0.40'
classifiers = [
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Operating System :: POSIX',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.14',
]
description = 'omllm'
dependencies = [
    'omcore == 0.0.40',
]

[project.optional-dependencies]
all = [
    'omdev == 0.0.40',
    'huggingface-hub ~= 1.26',
    'llama-cpp-python ~= 0.3',
    'mlx ~= 0.32; sys_platform == "darwin"',
    'mlx-lm ~= 0.31; sys_platform == "darwin"',
    'tinygrad ~= 0.13',
    'torch ~= 2.13',
    'transformers ~= 5.11',
]
omdev = [
    'omdev == 0.0.40',
]
interop = [
    'huggingface-hub ~= 1.26',
    'llama-cpp-python ~= 0.3',
    'mlx ~= 0.32; sys_platform == "darwin"',
    'mlx-lm ~= 0.31; sys_platform == "darwin"',
    'tinygrad ~= 0.13',
    'torch ~= 2.13',
    'transformers ~= 5.11',
]

[project.entry-points]
'omcore.manifests' = {omllm = 'omllm'}

[tool.setuptools]

[tool.setuptools.packages.find]
include = [
    'omllm',
    'omllm.*',
]
exclude = [
    '*.tests',
    '*.tests.*',
]

[tool.setuptools.package-data]
'*' = [
    '*.c',
    '*.cc',
    '*.cu',
    '*.h',
    '*.hh',
    '*.abnf',
    '*.g4',
    '.om-manifests.json',
    'py.typed',
    '*.md',
    'README',
    'README.rst',
    'LICENSE',
    'LICENSE.txt',
    'AUTHORS',
]
'omllm.modeldb' = [
    'cache.json.bz2',
]
