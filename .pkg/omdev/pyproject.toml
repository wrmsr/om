[build-system]
requires = [
    'setuptools',
]
build-backend = 'setuptools.build_meta'

[project]
name = 'omdev'
authors = [
    {name = 'wrmsr'},
]
urls = {source = 'https://github.com/wrmsr/om'}
license = 'BSD-3-Clause'
readme = 'README.md'
requires-python = '>=3.14'
version = '0.0.54'
classifiers = [
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Operating System :: POSIX',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
]
description = 'omdev'
dependencies = [
    'omcore == 0.0.54',
]

[project.optional-dependencies]
ominfra = [
    'ominfra == 0.0.54',
]
omllm = [
    'omllm == 0.0.54',
]
black = [
    'black ~= 26.5',
]
c = [
    'pycparser ~= 3.0',
    'pcpp ~= 1.30',
]
doc = [
    'docutils ~= 0.23',
]
mypy = [
    'mypy ~= 2.3',
]
ocr = [
    'pytesseract ~= 0.3',
    'rapidocr-onnxruntime ~= 1.4',
]
pillow = [
    'pillow ~= 12.3',
]
prof = [
    'gprof2dot ~= 2025.4',
]
pyright = [
    'basedpyright ~= 1.39',
]
qr = [
    'segno ~= 1.6',
]
ruff = [
    'ruff ~= 0.16',
]
tui-syntax = [
    'tree-sitter ~= 0.26',
    'tree-sitter-bash ~= 0.25',
    'tree-sitter-css ~= 0.25',
    'tree-sitter-go ~= 0.25',
    'tree-sitter-html ~= 0.23',
    'tree-sitter-java ~= 0.23',
    'tree-sitter-javascript ~= 0.25',
    'tree-sitter-json ~= 0.24',
    'tree-sitter-markdown ~= 0.5',
    'tree-sitter-python ~= 0.25',
    'tree-sitter-regex ~= 0.25',
    'tree-sitter-rust ~= 0.24',
    'tree-sitter-sql ~= 0.3',
    'tree-sitter-toml ~= 0.7',
    'tree-sitter-xml ~= 0.7',
    'tree-sitter-yaml ~= 0.7',
]
cext = [
    'omdev-cext == 0.0.54',
]
rs = [
    'omdev-rs == 0.0.54',
]
cli = [
    'omdev-cli == 0.0.54',
]
all = [
    'ominfra == 0.0.54',
    'omllm == 0.0.54',
    'black ~= 26.5',
    'pycparser ~= 3.0',
    'pcpp ~= 1.30',
    'docutils ~= 0.23',
    'mypy ~= 2.3',
    'pytesseract ~= 0.3',
    'rapidocr-onnxruntime ~= 1.4',
    'pillow ~= 12.3',
    'gprof2dot ~= 2025.4',
    'basedpyright ~= 1.39',
    'segno ~= 1.6',
    'ruff ~= 0.16',
    'tree-sitter ~= 0.26',
    'tree-sitter-bash ~= 0.25',
    'tree-sitter-css ~= 0.25',
    'tree-sitter-go ~= 0.25',
    'tree-sitter-html ~= 0.23',
    'tree-sitter-java ~= 0.23',
    'tree-sitter-javascript ~= 0.25',
    'tree-sitter-json ~= 0.24',
    'tree-sitter-markdown ~= 0.5',
    'tree-sitter-python ~= 0.25',
    'tree-sitter-regex ~= 0.25',
    'tree-sitter-rust ~= 0.24',
    'tree-sitter-sql ~= 0.3',
    'tree-sitter-toml ~= 0.7',
    'tree-sitter-xml ~= 0.7',
    'tree-sitter-yaml ~= 0.7',
    'omdev-cext == 0.0.54',
    'omdev-rs == 0.0.54',
    'omdev-cli == 0.0.54',
]

[project.entry-points]
'omcore.manifests' = {omdev = 'omdev'}

[tool.setuptools]

[tool.setuptools.packages.find]
include = [
    'omdev',
    'omdev.*',
]
exclude = [
    '*.tests',
    '*.tests.*',
]

[tool.setuptools.package-data]
'*' = [
    '*.c',
    '*.cc',
    '*.cu',
    '*.h',
    '*.hh',
    '*.js',
    '*.mjs',
    '*.ts',
    '*.abnf',
    '*.g4',
    '.om-manifests.json',
    'py.typed',
    '*.md',
    'README',
    'README.rst',
    'LICENSE',
    'LICENSE.txt',
    'AUTHORS',
]
'omdev.cc' = [
    'cdeps.toml',
]
'omdev.dockerdev' = [
    'config.toml',
    'resources/*',
    'resources/.*',
    'resources/configs/.*',
    'resources/depsets/*',
    'resources/fragments/*',
    'resources/scripts/*',
]
'omdev.pyproject' = [
    'resources/*',
]
'omdev.tools.jsonview' = [
    'resources/*',
]
